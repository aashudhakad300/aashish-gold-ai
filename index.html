<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>ASHISH GOLD AI — SMC PRO</title>

<style>
:root{
--bg:#080b12;--panel:#101722;--panel2:#0c121c;
--line:#26344a;--gold:#e9b957;--text:#edf2fa;
--muted:#91a0b5;--green:#24c995;--red:#f16e7d;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font:14px/1.5 Arial,system-ui,sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1800px;margin:auto;padding:12px}
header{
display:flex;justify-content:space-between;align-items:center;
gap:12px;padding:15px;background:#111b2a;
border:1px solid var(--line);border-radius:13px;margin-bottom:12px
}
.logo{font-size:20px;font-weight:900;color:var(--gold)}
h1{font-size:17px;margin:0}
.sub{font-size:10px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{
background:#182438;color:white;border:1px solid var(--line);
padding:9px 12px;border-radius:8px;font-size:11px
}
button.active,button:hover
